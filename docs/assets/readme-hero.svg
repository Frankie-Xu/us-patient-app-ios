<svg width="1440" height="860" viewBox="0 0 1440 860" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">US Patient App iOS synthetic product preview</title>
  <desc id="desc">A white and frosted glass patient visit preparation interface with blue and violet accents. All content is synthetic.</desc>
  <defs>
    <linearGradient id="canvas" x1="120" y1="40" x2="1320" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFF"/>
      <stop offset="0.55" stop-color="#F6F5FF"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="460" y1="150" x2="1110" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5A6BFF"/>
      <stop offset="1" stop-color="#8B6FF2"/>
    </linearGradient>
    <linearGradient id="softAccent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#DCE4FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#EEE8FF" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#243B78" flood-opacity="0.12"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#243B78" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1440" height="860" rx="44" fill="url(#canvas)"/>
  <circle cx="1230" cy="100" r="180" fill="#E6E8FF" fill-opacity="0.68"/>
  <circle cx="170" cy="760" r="220" fill="#E7F0FF" fill-opacity="0.7"/>

  <g filter="url(#shadow)">
    <rect x="70" y="66" width="1300" height="728" rx="36" fill="#FFFFFF" fill-opacity="0.8"/>
    <rect x="70.5" y="66.5" width="1299" height="727" rx="35.5" stroke="#FFFFFF" stroke-opacity="0.82"/>
  </g>

  <rect x="108" y="104" width="1224" height="52" rx="18" fill="#FFFFFF" fill-opacity="0.72"/>
  <circle cx="136" cy="130" r="7" fill="#D1D6E8"/>
  <circle cx="160" cy="130" r="7" fill="#D1D6E8"/>
  <circle cx="184" cy="130" r="7" fill="#D1D6E8"/>
  <text x="720" y="136" text-anchor="middle" fill="#77819A" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="15" font-weight="600" letter-spacing="0.3">SYNTHETIC PRODUCT PREVIEW · NO PATIENT DATA</text>

  <rect x="108" y="180" width="258" height="570" rx="28" fill="#F9FAFE" fill-opacity="0.72"/>
  <rect x="132" y="207" width="44" height="44" rx="14" fill="url(#accent)"/>
  <path d="M145 229.5L153.5 238L164 216" stroke="white" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="190" y="231" fill="#17213D" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="18" font-weight="700">US Patient</text>
  <text x="190" y="251" fill="#8B94AA" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="12" font-weight="500">Care, clearly prepared.</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="14" font-weight="600">
    <rect x="128" y="298" width="218" height="48" rx="15" fill="#EEF1FF"/>
    <circle cx="151" cy="322" r="8" fill="#5A6BFF"/>
    <text x="174" y="327" fill="#4454D8">Overview</text>
    <circle cx="151" cy="378" r="8" fill="#B3BBD1"/>
    <text x="174" y="383" fill="#77819A">My records</text>
    <circle cx="151" cy="434" r="8" fill="#B3BBD1"/>
    <text x="174" y="439" fill="#77819A">Visit prep</text>
    <circle cx="151" cy="490" r="8" fill="#B3BBD1"/>
    <text x="174" y="495" fill="#77819A">Shared packs</text>
  </g>

  <rect x="132" y="660" width="210" height="64" rx="18" fill="#FFFFFF" fill-opacity="0.82"/>
  <circle cx="158" cy="692" r="17" fill="url(#softAccent)"/>
  <path d="M151 692H165M158 685V699" stroke="#5A6BFF" stroke-width="2" stroke-linecap="round"/>
  <text x="186" y="689" fill="#3D4762" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="700">Add a record</text>
  <text x="186" y="708" fill="#8B94AA" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="500">PDF, image, or note</text>

  <text x="408" y="238" fill="#19233F" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="32" font-weight="700" letter-spacing="-0.7">Your care, clearly prepared.</text>
  <text x="408" y="270" fill="#7A849D" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="15" font-weight="500">Organize source-traceable visit notes before the next conversation.</text>
  <rect x="1116" y="214" width="164" height="44" rx="15" fill="#19233F"/>
  <text x="1198" y="241" text-anchor="middle" fill="white" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="700">Prepare a visit</text>

  <g filter="url(#smallShadow)">
    <rect x="408" y="314" width="430" height="188" rx="24" fill="#FFFFFF" fill-opacity="0.76"/>
    <rect x="408.5" y="314.5" width="429" height="187" rx="23.5" stroke="#FFFFFF" stroke-opacity="0.9"/>
  </g>
  <text x="436" y="350" fill="#7A849D" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="700" letter-spacing="0.7">NEXT VISIT</text>
  <text x="436" y="385" fill="#1A2440" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="24" font-weight="700">Primary care review</text>
  <text x="436" y="412" fill="#7A849D" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="500">Tuesday · 10:30 AM · 6 source items</text>
  <rect x="436" y="446" width="154" height="32" rx="11" fill="#EEF1FF"/>
  <text x="513" y="467" text-anchor="middle" fill="#4E5ED8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="700">Review in progress</text>
  <rect x="612" y="446" width="178" height="32" rx="11" fill="#F2EEFF"/>
  <text x="701" y="467" text-anchor="middle" fill="#785CE3" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="700">Source coverage 96%</text>

  <g filter="url(#smallShadow)">
    <rect x="864" y="314" width="416" height="188" rx="24" fill="url(#accent)"/>
  </g>
  <text x="894" y="350" fill="#E9ECFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="700" letter-spacing="0.7">PACK STATUS</text>
  <text x="894" y="386" fill="white" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="24" font-weight="700">Ready to share</text>
  <text x="894" y="414" fill="#E2E5FF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="500">Version 04 · reviewer link expires in 24h</text>
  <rect x="894" y="446" width="151" height="32" rx="11" fill="#FFFFFF" fill-opacity="0.18"/>
  <text x="969" y="467" text-anchor="middle" fill="white" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="700">View sources</text>
  <rect x="1056" y="446" width="188" height="32" rx="11" fill="#FFFFFF"/>
  <text x="1150" y="467" text-anchor="middle" fill="#4D5ED8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="700">Copy secure link</text>

  <g filter="url(#smallShadow)">
    <rect x="408" y="536" width="872" height="176" rx="24" fill="#FFFFFF" fill-opacity="0.76"/>
    <rect x="408.5" y="536.5" width="871" height="175" rx="23.5" stroke="#FFFFFF" stroke-opacity="0.9"/>
  </g>
  <text x="436" y="573" fill="#7A849D" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="700" letter-spacing="0.7">SOURCE-TRACEABLE SUMMARY</text>
  <text x="436" y="611" fill="#1A2440" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="18" font-weight="700">Review each fact before it enters the visit pack.</text>
  <text x="436" y="640" fill="#7A849D" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="500">Every item keeps its source, review state, and version history visible.</text>
  <rect x="436" y="664" width="236" height="10" rx="5" fill="#E8EBF5"/>
  <rect x="436" y="664" width="188" height="10" rx="5" fill="url(#accent)"/>
  <text x="704" y="674" fill="#56617D" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="700">4 of 5 reviewed</text>
  <circle cx="1120" cy="624" r="54" fill="#F1EEFF"/>
  <circle cx="1120" cy="624" r="38" stroke="#8271ED" stroke-width="9" stroke-linecap="round" stroke-dasharray="188 52" transform="rotate(-90 1120 624)"/>
  <text x="1120" y="630" text-anchor="middle" fill="#4C3EAE" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="20" font-weight="700">96%</text>
  <text x="1120" y="650" text-anchor="middle" fill="#8271ED" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10" font-weight="700">COVERAGE</text>
</svg>
