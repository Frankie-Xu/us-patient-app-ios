[project]
name = "us-patient-app-api"
version = "0.1.0"
description = "Initial source-traceable patient app API contract and service skeleton"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.7,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
# Keep the local extra aligned with the pytest version used by CI. A single
# supported major version prevents pip from silently downgrading the pinned
# CI tool when this project metadata is installed.
test = ["pytest>=9,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
pythonpath = ["../.."]
testpaths = ["tests"]
addopts = "-q"
