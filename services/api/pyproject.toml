[project]
name = "us-patient-app-api"
version = "0.1.0"
description = "Initial source-traceable patient app API contract and service skeleton"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.7,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
pythonpath = ["../.."]
testpaths = ["tests"]
addopts = "-q"
