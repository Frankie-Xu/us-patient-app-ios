name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    name: Repository validation
    runs-on: ubuntu-latest
    outputs:
      ios-present: ${{ steps.detect-ios.outputs.present }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up validation Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-ci.txt
      - name: Install pinned validation tools
        run: python -m pip install --disable-pip-version-check --no-input -r scripts/requirements-ci.txt
      - name: Validate repository contents
        run: bash scripts/validate-repo.sh
      - name: Check dependency manifests and versions
        run: bash scripts/check-dependencies.sh
      - name: Check workflow action pins
        run: bash scripts/check-workflow-pins.sh
      - name: Run scanner regression tests
        run: bash scripts/test-validate-repo.sh
      - name: Run production configuration contract regression
        run: bash scripts/test-production-config.sh
      - name: Run release evidence regression
        run: bash scripts/test-release-evidence.sh
      - name: Run contract drift regression
        run: bash scripts/test-contract-drift.sh
      - name: Run privacy evidence regression
        run: bash scripts/test-privacy-evidence.sh
      - name: Check patch formatting
        run: git diff --check
      - name: Detect iOS component
        id: detect-ios
        run: |
          if find apps/ios -type f \( -name Package.swift -o -name project.pbxproj -o -name contents.xcworkspacedata \) -not -path './.git/*' -not -path '*/.build/*' -not -path '*/Packages/*' -not -path '*/.swiftpm/*' -print -quit | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

  contract-validation:
    name: Contract validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up validation Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-ci.txt
      - name: Install pinned validation tools
        run: python -m pip install --disable-pip-version-check --no-input -r scripts/requirements-ci.txt
      - name: Validate OpenAPI and JSON Schemas
        run: bash scripts/check-openapi.sh
      - name: Check OpenAPI route inventory drift
        run: bash scripts/check-contract-drift.sh

  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-ci.txt
      - name: Install pinned test tools
        run: python -m pip install --disable-pip-version-check --no-input -r scripts/requirements-ci.txt
      - name: Discover HTTP route tests
        run: bash scripts/discover-http-route-tests.sh services/api
      - name: Run API and HTTP route tests when present
        run: bash scripts/run-python-tests.sh services/api
      - name: Run API readiness and health smoke
        if: always()
        env:
          READINESS_ARTIFACT_PATH: artifacts/api-readiness.json
        run: bash scripts/run-api-readiness.sh services/api
      - name: Upload API readiness result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-readiness-result
          path: artifacts/api-readiness.json
          if-no-files-found: error
          retention-days: 7

  ai-tests:
    name: AI tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-ci.txt
      - name: Install pinned test tools
        run: python -m pip install --disable-pip-version-check --no-input -r scripts/requirements-ci.txt
      - name: Run AI golden-set regression report
        env:
          AI_GOLDEN_ARTIFACT_PATH: artifacts/ai-golden-regression.json
        run: bash scripts/run-ai-golden-regression.sh services/ai
      - name: Run AI tests when present
        run: bash scripts/run-python-tests.sh services/ai
      - name: Upload AI golden regression result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-golden-regression-result
          path: artifacts/ai-golden-regression.json
          if-no-files-found: error
          retention-days: 7

  ios-tests:
    name: iOS tests
    needs: repository-validation
    if: ${{ needs.repository-validation.outputs.ios-present == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run iOS tests when present
        run: bash scripts/run-ios-tests.sh apps/ios

  release-evidence:
    name: Integration gate
    if: ${{ always() }}
    needs: [repository-validation, contract-validation, api-tests, ai-tests, ios-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up validation Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.3.0
        with:
          python-version: '3.12'
      - name: Generate synthetic production gate evidence
        id: synthetic-gate
        if: ${{ always() }}
        run: python scripts/production_gate.py --mode synthetic --output artifacts/production-gate-synthetic.json
      - name: Generate release evidence manifest
        if: ${{ always() }}
        env:
          RELEASE_EVIDENCE_WORKFLOW_VERSION: ci@2
          RELEASE_EVIDENCE_REPOSITORY_RESULT: ${{ needs.repository-validation.result }}
          RELEASE_EVIDENCE_CONTRACT_RESULT: ${{ needs.contract-validation.result }}
          RELEASE_EVIDENCE_API_RESULT: ${{ needs.api-tests.result }}
          RELEASE_EVIDENCE_AI_RESULT: ${{ needs.ai-tests.result }}
          RELEASE_EVIDENCE_IOS_RESULT: ${{ needs.ios-tests.result }}
          RELEASE_EVIDENCE_SYNTHETIC_GATE_RESULT: ${{ steps.synthetic-gate.outcome }}
          RELEASE_EVIDENCE_OUTPUT: artifacts/release-evidence.json
        run: python scripts/release_evidence.py --from-ci --output "$RELEASE_EVIDENCE_OUTPUT"
      - name: Check generated evidence redaction
        if: ${{ always() }}
        run: python scripts/check_privacy_evidence.py --input artifacts/release-evidence.json --input artifacts/production-gate-synthetic.json --output artifacts/privacy-evidence.json
      - name: Publish integration gate summary
        if: ${{ always() }}
        run: |
          python scripts/render_evidence_summary.py \
            --input artifacts/release-evidence.json \
            --output artifacts/release-evidence-summary.md
          cat artifacts/release-evidence-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload release evidence manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence-manifest
          path: |
            artifacts/release-evidence.json
            artifacts/production-gate-synthetic.json
            artifacts/privacy-evidence.json
            artifacts/release-evidence-summary.md
          if-no-files-found: error
          retention-days: 7
